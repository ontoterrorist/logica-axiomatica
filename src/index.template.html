<title>Lógica Axiomática</title>

<body>
<div class="gba">
  <div class="bezel">
    <div class="btop"><span class="led"></span><span class="brand">L<span class="acc">O</span>GICA <b>AXIOM<span class="acc">A</span>TICA</b></span></div>
    <main id="app" class="screen"></main>
    <div id="modal" hidden></div>
  </div>
  <aside class="pad" aria-label="Controles de la consola">
    <div class="shoulders">
      <button class="sh" data-pad="L" title="L (tecla A)">L</button>
      <button class="sh" data-pad="R" title="R (tecla S)">R</button>
    </div>
    <div class="dpad">
      <button class="up" data-pad="up" aria-label="Arriba"></button>
      <button class="left" data-pad="left" aria-label="Izquierda"></button>
      <button class="right" data-pad="right" aria-label="Derecha"></button>
      <button class="down" data-pad="down" aria-label="Abajo"></button>
    </div>
    <div class="ab">
      <button class="rb b" data-pad="B" title="B (tecla X)">B</button>
      <button class="rb a" data-pad="A" title="A (tecla Z)">A</button>
    </div>
    <div class="ss">
      <span><button data-pad="select" aria-label="Select" title="Select (Retroceso)"></button>SELECT</span>
      <span><button data-pad="start" aria-label="Start" title="Start (Intro)"></button>START</span>
    </div>
    <p class="legend" id="legend"></p>
    <div class="speaker" aria-hidden="true"></div>
  </aside>
</div>
